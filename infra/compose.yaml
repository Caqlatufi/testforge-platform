name: ${COMPOSE_PROJECT_NAME:-testforge}

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-testforge}
      MYSQL_USER: ${MYSQL_USER:-testforge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-testforge_mysql}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-testforge_root}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      - testforge

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-testforge_redis}
    command:
      - sh
      - -ec
      - exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$${REDIS_PASSWORD}"
    ports:
      - "${TESTFORGE_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - testforge

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2024-05-10T01-41-38Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-testforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-testforge_minio}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "${TESTFORGE_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${TESTFORGE_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - testforge

  minio-init:
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc:RELEASE.2024-05-09T17-04-24Z}
    restart: "no"
    profiles:
      - init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-testforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-testforge_minio}
      MINIO_ARTIFACT_BUCKET: ${MINIO_ARTIFACT_BUCKET:-testforge-artifacts}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_ARTIFACT_BUCKET}"
        mc anonymous set none "local/$${MINIO_ARTIFACT_BUCKET}"
    networks:
      - testforge

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.101.0}
    restart: unless-stopped
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    environment:
      TESTFORGE_ENV: ${TESTFORGE_ENV:-dev}
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_HEALTH_PORT:-13133}:13133"
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    healthcheck:
      test:
        - CMD
        - /otelcol-contrib
        - components
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - testforge

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.52.0}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider http://127.0.0.1:9090/-/healthy
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      otel-collector:
        condition: service_healthy
    networks:
      - testforge

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.0.0}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-testforge_grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider http://127.0.0.1:3000/api/health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - testforge

networks:
  testforge:
    name: ${COMPOSE_PROJECT_NAME:-testforge}-network

volumes:
  mysql-data:
    name: ${COMPOSE_PROJECT_NAME:-testforge}-mysql-data
  redis-data:
    name: ${COMPOSE_PROJECT_NAME:-testforge}-redis-data
  minio-data:
    name: ${COMPOSE_PROJECT_NAME:-testforge}-minio-data
  prometheus-data:
    name: ${COMPOSE_PROJECT_NAME:-testforge}-prometheus-data
  grafana-data:
    name: ${COMPOSE_PROJECT_NAME:-testforge}-grafana-data
