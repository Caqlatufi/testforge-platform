[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "testforge-worker"
version = "0.1.0"
description = "TestForge task execution worker scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "oss2>=2.19,<3",
    "minio>=7.2,<8",
    "pytest>=9.0.3,<10",
    "playwright>=1.52,<2",
    "redis>=5,<7",
    "requests>=2.28,<3",
    "async-timeout>=4.0.3,<5; python_version < '3.11'",
]

[project.scripts]
testforge-worker = "testforge_worker.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "__pycache__/*.pyc"]

[tool.setuptools.packages.find]
include = ["testforge_worker*"]
