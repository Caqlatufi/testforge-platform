openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: TestForge Control Plane API
  version: 1.0.0
  description: |
    TestForge 项目、用例、Workflow、Run、Worker、Attempt、报告与诊断的公开契约。
    MySQL 是运行状态真相源；派发和回调均按至少一次语义处理。
    AI 诊断仅给出带证据的建议，不改变确定性测试结果。
servers:
  - url: http://localhost:8081
    description: 本地开发环境
tags:
  - name: Health
  - name: Projects
  - name: Environments
  - name: Catalog
  - name: Workflows
  - name: TestJobs
  - name: CICD
  - name: Runs
  - name: Workers
  - name: Attempts
  - name: Reports
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      security: []
      responses:
        "200":
          description: 应用可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      responses:
        "200":
          description: 项目列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Project"
    post:
      tags: [Projects]
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          $ref: "#/components/responses/ProjectCreated"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/projects/{projectId}:
    get:
      tags: [Projects]
      operationId: getProject
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 项目及被测对象摘要
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Projects]
      operationId: updateProject
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "200":
          description: 项目已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Project"

  /api/v1/projects/{projectId}/targets:
    post:
      tags: [Projects]
      operationId: createTarget
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTargetRequest"
      responses:
        "201":
          description: 被测对象已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Target"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/environments:
    get:
      tags: [Environments]
      operationId: listEnvironments
      parameters:
        - name: enabled
          in: query
          schema: { type: boolean }
        - name: platform
          in: query
          schema: { type: string, enum: [WINDOWS, ANDROID, IOS] }
      responses:
        "200":
          description: 平台级共享环境目录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/Environment" } }
    post:
      tags: [Environments]
      operationId: createEnvironment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnvironmentRequest"
      responses:
        "201":
          description: 全局共享环境已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/targets/{targetId}:
    put:
      tags: [Projects]
      operationId: updateTarget
      parameters:
        - $ref: "#/components/parameters/TargetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTargetRequest"
      responses:
        "200":
          description: 被测对象已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Target"

  /api/v1/targets/{targetId}/revisions/resolve:
    post:
      tags: [Projects]
      operationId: resolveTargetRevision
      parameters:
        - $ref: "#/components/parameters/TargetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionSelector"
      responses:
        "200":
          description: Git 引用已解析为不可变 Commit
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ResolvedRevision"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{projectId}/revisions:
    get:
      tags: [Projects]
      operationId: listProjectRevisions
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [BRANCH, TAG]
      responses:
        "200":
          description: 分支或 Tag 及其当前 Commit 元数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/RevisionOption"

  /api/v1/environments/{environmentId}:
    put:
      tags: [Environments]
      operationId: updateEnvironment
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnvironmentRequest"
      responses:
        "200":
          description: 环境已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Environment"

  /api/v1/environments/runtime:
    get:
      tags: [Environments]
      operationId: listEnvironmentRuntimeStatuses
      responses:
        "200":
          description: 已登记环境的真实基础设施运行状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/EnvironmentRuntimeStatus"

  /api/v1/environments/runtime/{environmentId}/start:
    post:
      tags: [Environments]
      operationId: startEnvironmentRuntime
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: 环境启动命令已完成；重复启动已运行环境保持幂等
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/EnvironmentRuntimeStatus"

  /api/v1/projects/{projectId}/cases:
    get:
      tags: [Catalog]
      operationId: listCases
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 项目下的原子用例列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/TestCase"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Catalog]
      operationId: createCase
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaseRequest"
      responses:
        "201":
          $ref: "#/components/responses/ResourceCreated"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/cases/{caseId}:
    get:
      tags: [Catalog]
      operationId: getCase
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: 原子用例详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TestCase"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Catalog]
      operationId: updateCase
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaseRequest"
      responses:
        "200":
          description: 原子用例已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TestCase"

  /api/v1/cases/shared:
    get:
      tags: [Catalog]
      operationId: listSharedCases
      responses:
        "200":
          description: 平台通用原子用例列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/TestCase"

  /api/v1/projects/{projectId}/case-definitions/validate:
    post:
      tags: [Catalog]
      operationId: validateCaseDefinition
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseDefinitionRequest"
      responses:
        "200":
          description: YAML Case 校验结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CaseDefinition"

  /api/v1/projects/{projectId}/case-definitions:
    post:
      tags: [Catalog]
      operationId: createCaseDefinition
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseDefinitionRequest"
      responses:
        "201":
          $ref: "#/components/responses/ResourceCreated"

  /api/v1/cases/{caseId}/definition:
    get:
      tags: [Catalog]
      operationId: getCaseDefinition
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: YAML Case 定义
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CaseDefinition"
    put:
      tags: [Catalog]
      operationId: updateCaseDefinition
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseDefinitionRequest"
      responses:
        "200":
          description: YAML Case 已更新

  /api/v1/projects/{projectId}/assets:
    get:
      tags: [Catalog]
      operationId: listCaseAssets
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 项目托管脚本资源
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CaseAsset"
    post:
      tags: [Catalog]
      operationId: uploadCaseAsset
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: 资源已存储或命中内容去重

  /api/v1/assets/{assetId}:
    get:
      tags: [Catalog]
      operationId: getCaseAsset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: 托管资源元数据

  /api/v1/assets/{assetId}/content:
    get:
      tags: [Catalog]
      operationId: downloadCaseAsset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Worker 使用的不可变资源内容
          headers:
            X-TestForge-SHA256:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /api/v1/cases/{caseId}/scripts:
    get:
      tags: [Catalog]
      operationId: listScriptVersions
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: 用例的不可变脚本版本列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ScriptVersion"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Catalog]
      operationId: createScriptVersion
      deprecated: true
      description: 仅供旧版初始化与兼容工具；新建和编辑 Case 必须使用 YAML Case Definition API。
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScriptVersionRequest"
      responses:
        "201":
          $ref: "#/components/responses/ResourceCreated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{projectId}/suites:
    get:
      tags: [Catalog]
      operationId: listSuites
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: targetId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: 项目和被测对象下的无序套件列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/TestSuite"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Catalog]
      operationId: createSuite
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSuiteRequest"
      responses:
        "201":
          $ref: "#/components/responses/ResourceCreated"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/suites/{suiteId}:
    get:
      tags: [Catalog]
      operationId: getSuite
      parameters:
        - $ref: "#/components/parameters/SuiteId"
      responses:
        "200":
          description: TestSuite 详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TestSuite"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Catalog]
      operationId: updateSuite
      parameters:
        - $ref: "#/components/parameters/SuiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSuiteRequest"
      responses:
        "200":
          description: TestSuite 已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TestSuite"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/projects/{projectId}/workflows:
    post:
      tags: [Workflows]
      operationId: createWorkflow
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkflowRequest"
      responses:
        "201":
          $ref: "#/components/responses/ResourceCreated"

  /api/v1/workflows/{workflowId}/graph:
    put:
      tags: [Workflows]
      operationId: saveWorkflowGraph
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowGraphRequest"
      responses:
        "200":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/workflows/{workflowId}/publish:
    post:
      tags: [Workflows]
      operationId: publishWorkflow
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdempotentRequest"
      responses:
        "200":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/workflows/{workflowId}:
    get:
      tags: [Workflows]
      operationId: getWorkflow
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
        - name: version
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: 草稿或指定发布版本
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WorkflowGraph"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/targets/{targetId}/deployment-profiles:
    get:
      tags: [CICD]
      operationId: listDeploymentProfiles
      parameters:
        - $ref: "#/components/parameters/TargetId"
      responses:
        "200":
          description: 目标的 CI/CD 接入配置
    post:
      tags: [CICD]
      operationId: createDeploymentProfile
      parameters:
        - $ref: "#/components/parameters/TargetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeploymentProfileRequest"
      responses:
        "201":
          description: Jenkins DeploymentProfile 已创建

  /api/v1/targets/{targetId}/deployments:
    get:
      tags: [CICD]
      operationId: listTargetDeployments
      parameters:
        - $ref: "#/components/parameters/TargetId"
      responses:
        "200":
          description: 目标的部署历史
    post:
      tags: [CICD]
      operationId: prepareTargetDeployment
      parameters:
        - $ref: "#/components/parameters/TargetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrepareDeploymentRequest"
      responses:
        "201":
          description: 已复用或新建不可变 Commit 对应的 Deployment
        "423":
          description: DeploymentProfile 并发配额已满

  /api/v1/deployments/{deploymentId}:
    get:
      tags: [CICD]
      operationId: getTargetDeployment
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Deployment 当前状态

  /api/v1/deployments/{deploymentId}/callbacks/jenkins:
    post:
      tags: [CICD]
      operationId: acceptJenkinsDeploymentCallback
      security: []
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JenkinsDeploymentCallbackRequest"
      responses:
        "200":
          description: 回调已幂等接受
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/projects/{projectId}/pipelines:
    get:
      tags: [CICD]
      operationId: listProjectPipelines
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 由 CI Provider 提供的只读 Pipeline 目录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/PipelineRef" } }

  /api/v1/test-jobs:
    get:
      tags: [TestJobs]
      operationId: listTestJobs
      parameters:
        - name: projectId
          in: query
          schema: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: Test Job 列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/TestJob" } }
    post:
      tags: [TestJobs]
      operationId: createTestJob
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveTestJobRequest" }
      responses:
        "201":
          description: DRAFT Test Job 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/TestJob" } }

  /api/v1/test-jobs/{testJobId}:
    get:
      tags: [TestJobs]
      operationId: getTestJob
      parameters:
        - $ref: "#/components/parameters/TestJobId"
      responses:
        "200":
          description: Test Job 详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/TestJob" } }
    put:
      tags: [TestJobs]
      operationId: updateTestJob
      parameters:
        - $ref: "#/components/parameters/TestJobId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveTestJobRequest" }
      responses:
        "200": { description: Test Job 已更新并回到 DRAFT }

  /api/v1/test-jobs/{testJobId}/activate:
    post:
      tags: [TestJobs]
      operationId: activateTestJob
      parameters:
        - $ref: "#/components/parameters/TestJobId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestJobVersionRequest" }
      responses:
        "200": { description: 外部引用重验通过，Test Job 已启用 }

  /api/v1/test-jobs/{testJobId}/disable:
    post:
      tags: [TestJobs]
      operationId: disableTestJob
      parameters:
        - $ref: "#/components/parameters/TestJobId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestJobVersionRequest" }
      responses:
        "200": { description: Test Job 已禁用 }

  /api/v1/test-jobs/{testJobId}/copies:
    post:
      tags: [TestJobs]
      operationId: copyTestJob
      parameters:
        - $ref: "#/components/parameters/TestJobId"
      responses:
        "201": { description: 同配置、同 Commit 的 DRAFT 测试任务副本已创建 }

  /api/v1/test-jobs/{testJobId}/execute:
    post:
      tags: [TestJobs, Runs]
      operationId: executeTestJob
      parameters:
        - $ref: "#/components/parameters/TestJobId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdempotentRequest" }
      responses:
        "201": { description: 使用任务固定 Commit 的内部执行 Attempt 已创建 }
        "409": { description: 任务未确认或已有活动 Attempt }

  /api/v1/test-jobs/{testJobId}/attempts:
    get:
      tags: [TestJobs, Runs]
      operationId: listTestJobAttempts
      parameters:
        - $ref: "#/components/parameters/TestJobId"
      responses:
        "200": { description: 当前测试任务的内部执行 Attempt 历史 }

  /api/v1/test-jobs/{testJobId}/runs:
    get:
      tags: [TestJobs, Runs]
      operationId: listTestJobRuns
      parameters:
        - $ref: "#/components/parameters/TestJobId"
      responses:
        "200": { description: 当前任务的 Run 历史 }
    post:
      tags: [TestJobs, Runs]
      operationId: launchTestJobRun
      parameters:
        - $ref: "#/components/parameters/TestJobId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdempotentRequest" }
      responses:
        "201": { description: 带 TestJobSnapshot 的 Run 已创建 }

  /api/v1/test-jobs/{testJobId}/comparison-runs:
    post:
      tags: [TestJobs, Runs]
      operationId: launchTestJobComparison
      parameters:
        - $ref: "#/components/parameters/TestJobId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComparisonLaunchRequest" }
      responses:
        "201": { description: baseline/candidate 配对 Run 已创建 }

  /api/v1/test-jobs/run-summaries:
    get:
      tags: [TestJobs, Runs]
      operationId: listTestJobRunSummaries
      responses:
        "200":
          description: 实时运行中心一级 Test Job 摘要
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/TestTaskExecutionSummary" } }

  /api/v1/test-jobs/execution-summaries:
    get:
      tags: [TestJobs, Runs]
      operationId: listTestTaskExecutionSummaries
      responses:
        "200":
          description: 实时运行中心测试任务摘要
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/TestTaskExecutionSummary" } }

  /api/v1/runs:
    post:
      tags: [Runs]
      operationId: createRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
      responses:
        "201":
          description: Run 已幂等创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RunSummary"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"

  /api/v1/runs/{runId}:
    get:
      tags: [Runs]
      operationId: getRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run 聚合及计数
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RunSummary"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/runs/{runId}/cancel:
    post:
      tags: [Runs]
      operationId: cancelRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRunRequest"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/runs/{runId}/graph:
    get:
      tags: [Runs]
      operationId: getRunGraph
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: 发布 DAG 快照与节点运行态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RunGraph"

  /api/v1/runs/{runId}/events:
    get:
      tags: [Runs]
      operationId: streamRunEvents
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 可使用 Last-Event-ID 续传的 SSE 事件流
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
                description: 每个 data 字段是 domain-event.schema.json 实例

  /api/v1/runs/{runId}/events/history:
    get:
      tags: [Runs]
      operationId: listRunExecutionEvents
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: afterEventId
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: 按持久化事件 ID 升序返回，afterEventId 为排他游标
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ExecutionEventHistory"

  /api/v1/monitoring/resources:
    get:
      tags: [Observability]
      operationId: getPlatformResourceSnapshot
      responses:
        "200":
          description: 进程池、设备池与派发链路当前快照
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PlatformResourceSnapshot"

  /api/v1/reports/comparisons:
    get:
      tags: [Reports]
      operationId: compareRuns
      parameters:
        - name: baselineRunId
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: candidateRunId
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: 对同一项目、同一 Workflow 的两个 Run 做逐 Case 差分
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RunComparisonReport"

  /api/v1/reports/comparison-groups/{comparisonGroupId}:
    get:
      tags: [Reports]
      operationId: compareRunGroup
      parameters:
        - name: comparisonGroupId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: 按持久化 comparisonGroupId 生成差分报告
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RunComparisonReport" }

  /api/v1/workers/register:
    post:
      tags: [Workers]
      operationId: registerWorker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterWorkerRequest"
      responses:
        "200":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/workers/{workerId}/devices:
    put:
      tags: [Workers]
      operationId: upsertDeviceSlot
      parameters:
        - $ref: "#/components/parameters/WorkerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertDeviceRequest"
      responses:
        "200":
          $ref: "#/components/responses/Accepted"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/attempts/{attemptId}/start:
    post:
      tags: [Attempts]
      operationId: startAttempt
      parameters:
        - $ref: "#/components/parameters/AttemptId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttemptLeaseRequest"
      responses:
        "200":
          $ref: "#/components/responses/Accepted"
        "409":
          $ref: "#/components/responses/LeaseExpired"

  /api/v1/attempts/{attemptId}/heartbeat:
    post:
      tags: [Attempts]
      operationId: heartbeatAttempt
      parameters:
        - $ref: "#/components/parameters/AttemptId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttemptHeartbeatRequest"
      responses:
        "200":
          $ref: "#/components/responses/Accepted"
        "409":
          $ref: "#/components/responses/LeaseExpired"

  /api/v1/attempts/{attemptId}/callback:
    post:
      tags: [Attempts]
      operationId: completeAttempt
      description: 相同 callbackKey 与载荷返回原结果；相同 key 不同载荷返回 409；失效 Attempt 仅记录审计事件。
      parameters:
        - $ref: "#/components/parameters/AttemptId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../../schemas/v1/attempt-callback.schema.json"
      responses:
        "200":
          description: 首次或幂等重复回调已接收
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CallbackReceipt"
        "409":
          description: 幂等冲突或租约失效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/attempts/{attemptId}/artifacts:
    post:
      tags: [Attempts]
      operationId: createAttemptArtifactUploadPolicy
      description: Gateway 校验 Attempt 租约后，签发限定 objectKey、大小和 SHA-256 元数据的短期 OSS POST 策略。
      parameters:
        - $ref: "#/components/parameters/AttemptId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactUploadPolicyRequest"
      responses:
        "200":
          description: 短期 OSS 直传策略
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ArtifactUploadPolicy"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/StateConflict"
        "503":
          description: OSS 上传策略未配置

  /api/v1/reports/runs/{runId}:
    get:
      tags: [Reports]
      operationId: getRunReport
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: 确定性运行报告
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RunReport"

  /api/v1/reports/runs/cases/{caseId}/history:
    get:
      tags: [Reports]
      operationId: getCaseRunHistory
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: 同一 Case 最近十次有效结果及 Flaky 证据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CaseHistory"

  /api/v1/device-slots:
    get:
      tags: [Workers]
      operationId: listDeviceSlotPanel
      responses:
        "200":
          description: DeviceSlot 在线状态与当前安全租约
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/DeviceSlotPanel"

  /api/v1/reports/{runId}/diagnosis/status:
    get:
      tags: [Reports]
      operationId: getAiDiagnosisStatus
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: AI Provider 可用或显式降级状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AiDiagnosisStatus"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/reports/{reportId}/diagnosis:
    get:
      tags: [Reports]
      operationId: getLatestReportDiagnosis
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: 最近一次成功的 AI 建议
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AiDiagnosis"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/comparison-runs:
    post:
      tags: [Runs]
      operationId: createComparisonRun
      summary: 一次幂等创建 baseline/candidate 配对 Run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComparisonRunRequest"
      responses:
        "201":
          description: 配对 Run 已创建，两侧版本均已固化为 Commit
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ComparisonRun" }
        "409":
          $ref: "#/components/responses/IdempotencyConflict"

  /api/v1/comparison-runs/{comparisonGroupId}:
    get:
      tags: [Runs]
      operationId: getComparisonRun
      parameters:
        - name: comparisonGroupId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: 配对 Run 与两侧固化版本
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ComparisonRun" }
    post:
      tags: [Reports]
      operationId: diagnoseReport
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosisRequest"
      responses:
        "200":
          description: 带证据引用的 AI 建议
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RestResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AiDiagnosis"
        "503":
          description: Provider 不可用；确定性报告仍有效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    TestJobId:
      name: testJobId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    TargetId:
      name: targetId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    SuiteId:
      name: suiteId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    RunId:
      name: runId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    WorkerId:
      name: workerId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

  responses:
    ProjectCreated:
      description: 项目已创建
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/RestResponse"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Project"
    ResourceCreated:
      description: 资源已创建
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/RestResponse"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ResourceIdentity"
    Accepted:
      description: 操作已接受
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestResponse"
    ValidationError:
      description: 字段或状态输入非法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IdempotencyConflict:
      description: 相同幂等键对应不同内容
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    StateConflict:
      description: 状态或版本已变化
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    LeaseExpired:
      description: 租约失效或 Attempt 已被替代
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Uuid:
      type: string
      format: uuid
    RestResponse:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
          pattern: "^[a-f0-9]{32}$"
        data: {}
    ErrorResponse:
      allOf:
        - $ref: "#/components/schemas/RestResponse"
        - type: object
          required: [code, message, traceId]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - RESOURCE_NOT_FOUND
                - IDEMPOTENCY_CONFLICT
                - STATE_CONFLICT
                - LEASE_EXPIRED
                - CONCURRENCY_LIMITED
                - DISPATCH_UNAVAILABLE
                - AI_PROVIDER_UNAVAILABLE
                - TARGET_SOURCE_NOT_CONFIGURED
                - REVISION_NOT_FOUND
                - REVISION_RESOLUTION_FAILED
                - REVISION_RESOLUTION_TIMEOUT
            details:
              type: object
              additionalProperties: true
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DEGRADED]
        components:
          type: object
          additionalProperties:
            type: string
    ResourceIdentity:
      type: object
      required: [id]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        version:
          type: integer
          minimum: 1
    IdempotentRequest:
      type: object
      additionalProperties: false
      required: [requestKey]
      properties:
        requestKey:
          $ref: "#/components/schemas/Uuid"
    TaskRevisionOverride:
      type: object
      additionalProperties: false
      required: [workflowNodeId, revision]
      properties:
        workflowNodeId:
          $ref: "#/components/schemas/Uuid"
        revision:
          $ref: "#/components/schemas/RevisionSelector"
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name, repositoryUrl, defaultBranch]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        code:
          type: string
          maxLength: 63
          deprecated: true
          description: 兼容旧客户端的内部标识；新客户端省略，由服务端使用 Project UUID 自动生成。
        targetType:
          type: string
          enum: [HTTP_SERVICE, WEB, DESKTOP, MOBILE]
          deprecated: true
