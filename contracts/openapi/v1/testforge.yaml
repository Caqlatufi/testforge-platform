        projectId: { $ref: "#/components/schemas/Uuid" }
        targetId: { $ref: "#/components/schemas/Uuid" }
        environmentId: { $ref: "#/components/schemas/Uuid" }
        workflowId: { $ref: "#/components/schemas/Uuid" }
        workflowVersion: { type: integer, minimum: 1 }
        priority: { type: integer, minimum: 0, maximum: 9 }
        maxConcurrency: { type: integer, minimum: 1, maximum: 20 }
        processConcurrency: { type: integer, minimum: 1, maximum: 100 }
        deviceConcurrency: { type: integer, minimum: 1, maximum: 100 }
        requestKey: { $ref: "#/components/schemas/Uuid" }
        baselineRevision: { $ref: "#/components/schemas/RevisionSelector" }
        candidateRevision: { $ref: "#/components/schemas/RevisionSelector" }
        deploymentProfileId: { $ref: "#/components/schemas/Uuid" }
    ComparisonRun:
      type: object
      required: [id, requestKey, baselineRun, candidateRun, baselineResolvedCommit, candidateResolvedCommit, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        requestKey: { $ref: "#/components/schemas/Uuid" }
        baselineRun: { $ref: "#/components/schemas/RunSummary" }
        candidateRun: { $ref: "#/components/schemas/RunSummary" }
        baselineResolvedCommit: { type: string, pattern: "^[0-9a-fA-F]{40}$" }
        candidateResolvedCommit: { type: string, pattern: "^[0-9a-fA-F]{40}$" }
        createdAt: { type: string, format: date-time }
    CreateDeploymentProfileRequest:
      type: object
      additionalProperties: false
      required: [name, serverUrl, jobName, buildConfigDigest, maxConcurrency, ttlSeconds]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        serverUrl: { type: string, format: uri, maxLength: 2048 }
        jobName: { type: string, minLength: 1, maxLength: 512 }
        credentialRef:
          type: [string, "null"]
          maxLength: 128
          description: 只保存本机或密钥系统中的引用，不保存 Jenkins Token。
        buildConfigDigest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        maxConcurrency: { type: integer, minimum: 1, maximum: 50 }
        ttlSeconds: { type: integer, minimum: 60, maximum: 604800 }
    PrepareDeploymentRequest:
      type: object
      additionalProperties: false
      required: [profileId, resolvedCommit]
      properties:
        profileId: { $ref: "#/components/schemas/Uuid" }
        resolvedCommit:
          type: string
          pattern: "^[0-9a-fA-F]{40}$"
    DeploymentState:
      type: string
      enum: [PENDING, TRIGGERED, BUILDING, READY, FAILED, EXPIRED]
    JenkinsDeploymentCallbackRequest:
      type: object
      additionalProperties: false
      required: [callbackKey, providerRunId, status]
      properties:
        callbackKey: { $ref: "#/components/schemas/Uuid" }
        providerRunId: { type: string, minLength: 1, maxLength: 2048 }
        status: { $ref: "#/components/schemas/DeploymentState" }
        endpoint: { type: [string, "null"], maxLength: 2048 }
        artifactUri: { type: [string, "null"], maxLength: 2048 }
        artifactDigest: { type: [string, "null"], maxLength: 255 }
        summary: { type: [string, "null"], maxLength: 1000 }
    CancelRunRequest:
      type: object
      additionalProperties: false
      required: [requestKey, reason]
      properties:
        requestKey:
          $ref: "#/components/schemas/Uuid"
        reason:
          type: string
          minLength: 1
          maxLength: 500
    RunState:
      type: string
      enum: [QUEUED, RUNNING, CANCELLING, SUCCEEDED, FAILED, COMPLETED_WITH_WARNINGS, CANCELLED]
    TaskState:
      type: string
      enum: [CREATED, WAITING_DEPLOYMENT, WAITING_DEPENDENCY, QUEUED, DISPATCHED, RUNNING, SUCCEEDED, FAILED, TIMEOUT, BLOCKED, CANCELLED]
    ExecutionEvent:
      type: object
      required: [id, eventKey, runId, type, occurredAt, payload]
      properties:
        id:
          type: integer
          format: int64
        eventKey:
          $ref: "#/components/schemas/Uuid"
        runId:
          $ref: "#/components/schemas/Uuid"
        taskId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        attemptId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        type:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{1,63}$"
        occurredAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
    ExecutionEventHistory:
      type: object
      required: [events, nextEventId]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/ExecutionEvent"
        nextEventId:
          type: integer
          format: int64
          minimum: 0
    DispatchTelemetrySnapshot:
      type: object
      required: [published, paused, redisUnavailable, redeliveries, recoveries]
      properties:
        published: { type: integer, format: int64 }
        paused: { type: integer, format: int64 }
        redisUnavailable: { type: integer, format: int64 }
        redeliveries: { type: integer, format: int64 }
        recoveries: { type: integer, format: int64 }
        lastObservation:
          type: [object, "null"]
          additionalProperties: true
    PlatformResourceSnapshot:
      type: object
      required: [processQueued, processRunning, processCapacity, deviceQueued, deviceRunning, deviceCapacity, deviceAvailable, onlineWorkers, dispatch]
      properties:
        processQueued: { type: integer, format: int64 }
        processRunning: { type: integer, format: int64 }
        processCapacity: { type: integer, format: int64 }
        deviceQueued: { type: integer, format: int64 }
        deviceRunning: { type: integer, format: int64 }
        deviceCapacity: { type: integer, format: int64 }
        deviceAvailable: { type: integer, format: int64 }
        onlineWorkers: { type: integer, format: int64 }
        dispatch:
          $ref: "#/components/schemas/DispatchTelemetrySnapshot"
    RunComparisonReport:
      type: object
      required: [baselineRunId, candidateRunId, summary, cases]
      properties:
        baselineRunId: { $ref: "#/components/schemas/Uuid" }
        candidateRunId: { $ref: "#/components/schemas/Uuid" }
        baselineRevision:
          oneOf:
            - $ref: "#/components/schemas/TaskTargetRevision"
            - type: "null"
        candidateRevision:
          oneOf:
            - $ref: "#/components/schemas/TaskTargetRevision"
            - type: "null"
        summary:
          type: object
          required: [regressions, fixed, bothPass, bothFail, notComparable]
          properties:
            regressions: { type: integer, format: int64 }
            fixed: { type: integer, format: int64 }
            bothPass: { type: integer, format: int64 }
            bothFail: { type: integer, format: int64 }
            notComparable: { type: integer, format: int64 }
        cases:
          type: array
          items:
            type: object
            required: [caseId, occurrence, baselineOutcome, candidateOutcome, conclusion]
            properties:
              caseId: { $ref: "#/components/schemas/Uuid" }
              occurrence: { type: integer, minimum: 1 }
              baselineTaskId:
                oneOf:
                  - $ref: "#/components/schemas/Uuid"
                  - type: "null"
              candidateTaskId:
                oneOf:
                  - $ref: "#/components/schemas/Uuid"
                  - type: "null"
              baselineOutcome: { type: string, enum: [PASS, FAIL, UNAVAILABLE] }
              candidateOutcome: { type: string, enum: [PASS, FAIL, UNAVAILABLE] }
              conclusion: { type: string, enum: [REGRESSION, FIXED, BOTH_PASS, BOTH_FAIL, NOT_COMPARABLE] }
    RunSummary:
      type: object
      required: [id, state, totalTasks, taskCounts, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        comparisonGroupId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        testJobId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        jobConfigVersion:
          type: integer
          minimum: 0
        state:
          $ref: "#/components/schemas/RunState"
        totalTasks:
          type: integer
          minimum: 0
        taskCounts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
    RunGraph:
      type: object
      required: [runId, workflowId, workflowVersion, compiledFallback, nodes, edges]
      properties:
        runId:
          $ref: "#/components/schemas/Uuid"
        testJobId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        workflowId: { $ref: "#/components/schemas/Uuid" }
        workflowVersion: { type: integer, minimum: 1 }
        compiledFallback: { type: boolean }
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/RunGraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/RunGraphEdge"
    RunGraphEdge:
      type: object
      additionalProperties: false
      required: [sourceNodeId, targetNodeId, condition]
      properties:
        sourceNodeId: { $ref: "#/components/schemas/Uuid" }
        targetNodeId: { $ref: "#/components/schemas/Uuid" }
        condition: { type: string, enum: [ON_SUCCESS, ON_COMPLETION] }
    RunGraphNode:
      type: object
      additionalProperties: false
      required: [id, type, label, positionX, positionY, state, taskIds, totalTasks, completedTasks]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        type:
          type: string
          enum: [CASE, SUITE, FIXTURE, SUBFLOW]
        label: { type: string }
        positionX:
          type: number
        positionY:
          type: number
        taskIds:
          type: array
          items: { $ref: "#/components/schemas/Uuid" }
        totalTasks: { type: integer, minimum: 0 }
        completedTasks: { type: integer, minimum: 0 }
        state:
          type: string
          enum: [EMPTY, QUEUED, RUNNING, SUCCEEDED, FAILED, BLOCKED]
    RegisterWorkerRequest:
      type: object
      additionalProperties: false
      required: [workerId, protocolVersion, capabilities, maxConcurrency]
      properties:
        workerId:
          type: string
          minLength: 1
          maxLength: 128
        protocolVersion:
          type: string
          pattern: "^1\\.[0-9]+$"
        capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: "^[A-Z][A-Z0-9_]{0,63}$"
        maxConcurrency:
          type: integer
          minimum: 1
          maximum: 128
    UpsertDeviceRequest:
      type: object
      additionalProperties: false
      required: [deviceId, platform, deviceUri, features, resolution]
      properties:
        deviceId:
          type: string
          minLength: 1
          maxLength: 128
        platform:
          type: string
          enum: [WINDOWS, ANDROID, IOS]
        deviceUri:
          type: string
          minLength: 1
          maxLength: 512
        features:
          type: array
          uniqueItems: true
          items:
            type: string
        resolution:
          type: object
          additionalProperties: false
          required: [width, height]
          properties:
            width:
              type: integer
              minimum: 1
            height:
              type: integer
              minimum: 1
    AttemptLeaseRequest:
      type: object
      additionalProperties: false
      required: [workerId, leaseToken]
      properties:
        workerId:
          type: string
          minLength: 1
          maxLength: 128
        leaseToken:
          $ref: "#/components/schemas/Uuid"
    AttemptHeartbeatRequest:
      type: object
      additionalProperties: false
      required: [workerId, leaseToken, progress, at]
      properties:
        workerId:
          type: string
          minLength: 1
          maxLength: 128
        leaseToken:
          $ref: "#/components/schemas/Uuid"
        progress:
          type: number
          minimum: 0
          maximum: 1
        at:
          type: string
          format: date-time
    ArtifactUploadPolicyRequest:
      type: object
      additionalProperties: false
      required: [workerId, leaseToken, objectKey, mediaType, sizeBytes, sha256]
      properties:
        workerId:
          type: string
          minLength: 1
          maxLength: 128
        leaseToken:
          $ref: "#/components/schemas/Uuid"
        objectKey:
          type: string
          minLength: 1
          maxLength: 1024
          description: 平台附件根目录下的相对键，必须归属当前 Attempt。
        mediaType:
          type: string
          minLength: 1
          maxLength: 255
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
    ArtifactUploadPolicy:
      type: object
      required: [uploadUrl, objectKey, expiresAt, fields]
      properties:
        uploadUrl:
          type: string
          format: uri
        objectKey:
          type: string
        expiresAt:
          type: string
          format: date-time
        fields:
          type: object
          additionalProperties:
            type: string
          description: Worker 原样提交给 OSS multipart/form-data 的短期签名字段。
    CallbackReceipt:
      type: object
      required: [attemptId, callbackKey, disposition, originalDisposition, receivedAt]
      properties:
        attemptId:
          $ref: "#/components/schemas/Uuid"
        callbackKey:
          $ref: "#/components/schemas/Uuid"
        disposition:
          type: string
          enum: [ACCEPTED, DUPLICATE, STALE]
          description: 本次请求的处理分类；幂等重放时为 DUPLICATE。
        originalDisposition:
          type: string
          enum: [ACCEPTED, STALE]
          description: 首次处理该幂等键时保存的结果分类。
        taskId:
          anyOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
          description: 首次回调被接受时完成的 Task；STALE 时为 null。
        resultStatus:
          anyOf:
            - type: string
              enum: [PASSED, ASSERTION_FAILED, INFRA_FAILED, CANCELLED]
            - type: "null"
          description: 首次回调被接受后的有效结果；STALE 时为 null。
        reason:
          type: [string, "null"]
          enum: [STALE_CALLBACK, null]
          description: 首次处理被拒绝时的稳定原因码。
        receivedAt:
          type: string
          format: date-time
          description: 首次处理该幂等键的时间，重复回调不会改变。
    RunReport:
      type: object
      required: [runId, runState, total, passed, failed, pending, durationMs, p50DurationMs, p95DurationMs, failureCategories, results, artifactKeys]
      properties:
        runId:
          $ref: "#/components/schemas/Uuid"
        runState:
          $ref: "#/components/schemas/RunState"
        total: { type: integer, minimum: 0 }
        passed: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        durationMs: { type: integer, format: int64, minimum: 0 }
        p50DurationMs:
          type: integer
          minimum: 0
        p95DurationMs:
          type: integer
          minimum: 0
        failureCategories:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        results:
          type: array
          items:
            $ref: "#/components/schemas/RunReportResult"
        artifactKeys:
          type: array
          items: { type: string }
    RunReportResult:
      type: object
      required: [taskId, caseId, attemptId, status, durationMs, summary, artifactKeys, targetRevision]
      properties:
        taskId: { $ref: "#/components/schemas/Uuid" }
        caseId: { $ref: "#/components/schemas/Uuid" }
        attemptId: { $ref: "#/components/schemas/Uuid" }
        status: { type: string, enum: [PASSED, ASSERTION_FAILED, INFRA_FAILED, CANCELLED] }
        durationMs: { type: integer, format: int64, minimum: 0 }
        failureType: { type: [string, "null"] }
        summary: { type: string }
        artifactKeys:
          type: array
          items: { type: string }
        targetRevision:
          oneOf:
            - $ref: "#/components/schemas/TaskTargetRevision"
            - type: "null"
    DeviceSlotPanel:
      type: object
      required: [slotId, workerId, deviceId, platform, features, status, leaseState, lastHeartbeatAt, expiresAt]
      properties:
        slotId: { $ref: "#/components/schemas/Uuid" }
        workerId: { type: string }
        deviceId: { type: string }
        platform: { type: string }
        features:
          type: array
          items: { type: string }
        status: { type: string, enum: [AVAILABLE, RESERVED, OFFLINE] }
        leaseState: { type: string, enum: [AVAILABLE, RESERVED] }
        currentAttemptId:
          anyOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        leaseUntil: { type: [string, "null"], format: date-time }
        lastHeartbeatAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    AiDiagnosisStatus:
      type: object
      required: [runId, available, status, message, provider, model, reasoningEffort]
      properties:
        runId: { $ref: "#/components/schemas/Uuid" }
        available: { type: boolean }
        status: { type: string, enum: [AVAILABLE, UNAVAILABLE] }
        message: { type: string }
        provider: { type: string, example: codex-cli }
        model: { type: string, example: gpt-5.6-luna }
        reasoningEffort: { type: string, example: high }
    CaseHistory:
      type: object
      required: [caseId, sampleSize, sufficientData, flaky, statusTransitions, recentResults]
      properties:
        caseId:
          $ref: "#/components/schemas/Uuid"
        sampleSize:
          type: integer
          minimum: 0
          maximum: 10
        sufficientData:
          type: boolean
        flaky:
          type: boolean
        statusTransitions:
          type: integer
          minimum: 0
        latestFailureType:
          type: [string, "null"]
        recentResults:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/CaseHistoryItem"
    CaseHistoryItem:
      type: object
      required: [recordedAt, runId, taskId, attemptId, finalStatus, durationMs]
      properties:
        recordedAt:
          type: string
          format: date-time
        runId:
          $ref: "#/components/schemas/Uuid"
        taskId:
          $ref: "#/components/schemas/Uuid"
        attemptId:
          $ref: "#/components/schemas/Uuid"
        finalStatus:
          type: string
          enum: [PASSED, ASSERTION_FAILED, INFRA_FAILED, CANCELLED]
        durationMs:
          type: integer
          format: int64
          minimum: 0
        failureType:
          type: [string, "null"]
    DiagnosisRequest:
      type: object
      additionalProperties: false
      required: [requestKey, forceRefresh]
      properties:
        requestKey:
          $ref: "#/components/schemas/Uuid"
        forceRefresh:
          type: boolean
    AiDiagnosis:
      type: object
      required: [diagnosisId, reportId, category, confidence, evidence, suggestions, missingEvidence, provider, model, reasoningEffort, reused, generatedAt]
      description: AI 建议不参与 Run 或 Task 的确定性状态判定。
      properties:
        diagnosisId:
          $ref: "#/components/schemas/Uuid"
        reportId:
          $ref: "#/components/schemas/Uuid"
        category:
          type: string
          enum: [PRODUCT_DEFECT, SCRIPT_ERROR, ENVIRONMENT, WORKER_LOST, FLAKY, UNKNOWN]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        evidence:
          type: array
          items:
            type: object
            required: [evidenceId, reason]
            properties:
              evidenceId:
                type: string
              reason:
                type: string
        suggestions:
          type: array
          items:
            type: string
        missingEvidence:
          type: array
          items:
            type: string
        model:
          type: string
        provider:
          type: string
        reasoningEffort:
          type: string
        reused:
          type: boolean
        generatedAt:
          type: string
          format: date-time
