name: TestForge MCP

"on":
  push:
    tags:
      - "testforge-mcp-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: testforge-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: testforge-mcp/go.sum
      - run: go test ./...
      - run: go vet ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            extension: .exe
          - goos: linux
            goarch: amd64
            extension: ""
          - goos: linux
            goarch: arm64
            extension: ""
          - goos: darwin
            goarch: amd64
            extension: ""
          - goos: darwin
            goarch: arm64
            extension: ""
    defaults:
      run:
        working-directory: testforge-mcp
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: testforge-mcp/go.sum
      - name: Build single-file binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#testforge-mcp-v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then version="0.1.0-dev"; fi
          output="dist/testforge-mcp-${GOOS}-${GOARCH}${{ matrix.extension }}"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "$output" ./cmd/testforge-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: testforge-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: testforge-mcp/dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/testforge-mcp-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: testforge-mcp-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: cd dist && sha256sum testforge-mcp-* > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
